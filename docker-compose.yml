# Runs whatnow the way `whatnow serve` does on your own machine.
#   docker compose up -d --build
# Then open http://localhost:7777.
# For the hosted, multi-user server, see docker-compose.hosted.yml and docs/hosting.md.

services:
  whatnow:
    build:
      context: .
      args:
        VERSION: ${WHATNOW_VERSION:-dev}
    restart: unless-stopped
    # Published on this machine only. whatnow has no sign-in, so don't widen this to 0.0.0.0.
    ports:
      - "127.0.0.1:7777:7777"
    environment:
      # The container has no OS keychain, so give the model key here (or in a .env file)
      # instead of saving it in Settings. Set whichever provider you use.
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      # Your time zone, for "today" and event times, e.g. America/New_York.
      TZ: ${TZ:-UTC}
    volumes:
      - whatnow-data:/data

volumes:
  # The SQLite database. `docker compose down` keeps it; `down -v` deletes it.
  whatnow-data:
