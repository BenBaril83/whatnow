# Runs whatnow the way `whatnow serve` does on your own machine.
#   docker compose up -d --build
# Then open http://localhost:7777.
# For the hosted, multi-user server, see docker-compose.hosted.yml and docs/hosting.md.

services:
  whatnow:
    build:
      context: .
      args:
        VERSION: ${WHATNOW_VERSION:-dev}
    restart: unless-stopped
    # Published on this machine only. whatnow has no sign-in, so anyone who can reach the port has
    # full access: to open it from another machine, set WHATNOW_BIND to that machine's address on
    # a network you trust (or 0.0.0.0 behind a firewall), and WHATNOW_ALLOWED_HOSTS to the name
    # or address you browse to.
    ports:
      - "${WHATNOW_BIND:-127.0.0.1}:7777:7777"
    environment:
      # Hostnames besides localhost the server answers, comma-separated, such as 192.168.1.20 or
      # nas.local. Without one, a browser on another machine gets "requests must come from this
      # machine or an allowed host". Settings > Remote access can add more once you're in.
      WHATNOW_ALLOWED_HOSTS:
      # The container has no OS keychain, so give the model key here (or in a .env file)
      # instead of saving it in Settings. Set whichever provider you use.
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      # Keeps integration secrets (calendar URLs, Jira and Linear tokens) and any key saved in
      # Settings encrypted in the database, since a container has no OS keychain. Without it the
      # Integrations page shows "internal error". Make one with `openssl rand -base64 32` and keep
      # a copy elsewhere: lose it and those secrets have to be entered again.
      WHATNOW_SEAL_KEY:
      # Your time zone, for "today" and event times, e.g. America/New_York.
      TZ: ${TZ:-UTC}
    volumes:
      - whatnow-data:/data

volumes:
  # The SQLite database. `docker compose down` keeps it; `down -v` deletes it.
  whatnow-data:
